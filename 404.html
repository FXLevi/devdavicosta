<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Davi Costa</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#141413" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <style>
    :root { color-scheme: dark light; --bg: #141413; --text: #f5f1e8; --muted: #b9b4a8; --ouro: #f5c400; --ouro-texto: #f5c400; }
    @media (prefers-color-scheme: light) { :root { --bg: #f4f1ea; --text: #141413; --muted: #55524a; --ouro-texto: #7a5f00; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: "Sansation", Arial, sans-serif; text-align: center; }
    main { max-width: 34rem; }
    .codigo { font-size: clamp(4rem, 18vw, 7rem); font-weight: 700; line-height: 1; margin: 0; color: var(--ouro-texto); }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 12px 0; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 8px; background: var(--ouro); color: #141413; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Volte ao portfólio para conhecer os projetos.</p>
    <a href="/">Voltar ao portfólio</a>
  </main>
</body>
</html>
